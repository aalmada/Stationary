# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore Stationary.CI.slnf
    - name: Build
      run: dotnet build Stationary.CI.slnf --no-restore
    - name: Test
      run: dotnet test --solution Stationary.CI.slnf --no-build --verbosity normal
    - name: Validate website and packaging script
      run: |
        python3 -m unittest discover -s scripts -p 'test_*.py'
        python3 scripts/build_site.py
        bash -n scripts/publish-macos.sh
