name: Prepare macOS website release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (major.minor.patch)'
        required: true
        type: string
      build:
        description: 'Positive build number'
        required: true
        type: string
      xcode:
        description: 'Exact workload-supported Xcode version available on the runner'
        default: '27.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-website-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.version }}
      BUILD: ${{ inputs.build }}
      XCODE_VERSION: ${{ inputs.xcode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Require a supported production toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD" =~ ^[1-9][0-9]*$ ]]
          [[ "$XCODE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          sdk="$(dotnet --version)"
          if [[ "$sdk" == *-* ]]; then
            echo "::error::Public releases require a supported stable .NET 11 SDK/workload. The repository currently pins $sdk."
            exit 1
          fi
          developer="/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          if [[ ! -d "$developer" ]]; then
            echo "::error::The requested Xcode is unavailable. Use the documented local packaging fallback."
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
      - name: Install pinned Mac Catalyst workload
        run: dotnet workload restore src/Stationary.Ftms.Dashboard/Stationary.Ftms.Dashboard.csproj
      - name: Restore and validate
        run: |
          dotnet restore Stationary.slnx
          dotnet test --solution Stationary.CI.slnf --no-restore
          dotnet format Stationary.slnx --verify-no-changes --no-restore
      - name: Create and validate DMG
        run: bash scripts/publish-macos.sh "$VERSION" "$BUILD"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos/${{ inputs.version }}/
          if-no-files-found: error

  draft:
    needs: package
    runs-on: ubuntu-latest
    environment: macos-release
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release
      - name: Create a draft, never publish automatically
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          printf '%s\n' \
            'Apple silicon only. This app is ad-hoc signed, not Developer ID signed or Apple-notarized.' \
            'Before publishing, complete the browser-download, Gatekeeper, hardware, upgrade and privacy/license checks in RELEASING.md.' \
            'The minimum macOS and build information are in release-info.txt.' > release-notes.txt
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Stationary $VERSION" --notes-file release-notes.txt \
            "Stationary-$VERSION-macos-arm64.dmg" SHA256SUMS release-info.txt
